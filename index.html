<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEIS DO GRUPO</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a6b;--navy-d:#061a45;--gold:#d9a824;--gold-l:#f0cf6b;--cream:#f6efdf;--ink:#1c2340;--red:#7d0f14;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--navy-d);background-image:radial-gradient(circle at 50% -10%,#123a8c,var(--navy-d) 60%);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 60px}
header{text-align:center;padding:34px 0 10px}
.flag{width:100%;max-width:520px;border:3px solid var(--gold);border-radius:4px;box-shadow:0 10px 40px #0008;display:block;margin:0 auto 22px}
h1{font-family:'Cinzel',Georgia,serif;font-size:clamp(28px,6vw,52px);letter-spacing:.12em;margin:0;color:var(--gold-l);text-shadow:0 2px 0 #000a}
.sub{font-style:italic;opacity:.85;margin:6px 0 0}
.orn{color:var(--gold);letter-spacing:.6em;margin:14px 0;font-size:20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
input[type=search]{flex:1;min-width:200px;padding:12px 16px;border:2px solid var(--gold);border-radius:4px;background:var(--cream);color:var(--ink);font:inherit}
button{font-family:'Cinzel',Georgia,serif;font-size:13px;letter-spacing:.06em;cursor:pointer;padding:12px 18px;border-radius:4px;border:2px solid var(--gold);background:var(--gold);color:var(--navy-d);font-weight:700}
button:hover{background:var(--gold-l)}
button.ghost{background:transparent;color:var(--gold-l)}
button.ghost:hover{background:#ffffff14}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--cream);color:var(--ink);border:2px solid var(--gold);border-radius:6px;padding:20px;cursor:pointer;position:relative;transition:.15s;box-shadow:inset 0 0 0 4px var(--cream),inset 0 0 0 5px var(--gold)}
.card:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 4px var(--cream),inset 0 0 0 5px var(--gold),0 8px 24px #0009}
.card .n{font-family:'Cinzel',serif;color:var(--red);font-size:13px;letter-spacing:.15em}
.card h3{font-family:'Cinzel',serif;color:var(--navy);margin:6px 0 8px;font-size:18px}
.card p{margin:0;font-size:17px;opacity:.85}
.empty{text-align:center;opacity:.8;padding:30px;display:none}
#modal{position:fixed;inset:0;background:#000b;display:none;z-index:10;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 30px}
#modal.on{display:block}
.sheet{max-width:780px;margin:0 auto;background:var(--cream);color:var(--ink);border:3px solid var(--gold);border-radius:6px;padding:26px 24px;position:relative}
.sheet h2{font-family:'Cinzel',serif;color:var(--navy);margin:0 0 4px;font-size:clamp(20px,4vw,28px)}
.sheet .intro{font-style:italic;margin:6px 0 14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tools input{flex:1;min-width:160px;border-color:var(--navy);padding:9px 12px}
.tools button{padding:9px 14px}
.tools button.ghost{color:var(--navy);border-color:var(--navy)}
.art{border-left:4px solid var(--gold);padding:4px 0 4px 14px;margin:14px 0}
.art ul{margin:6px 0 0;padding-left:22px}
mark{background:var(--gold-l);padding:0 2px}
.close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--navy);font-size:26px;padding:4px 10px}
.close:hover{background:none;color:var(--red)}
.msg{font-size:15px;opacity:.75;min-height:20px}
footer{text-align:center;opacity:.6;margin-top:40px;font-size:15px}
</style>
</head>

{id:"lei-1-protecao-da-constituicao",n:"LEI 1",title:"Proteção da Constituição",
intro:"Esta Lei tem por finalidade assegurar a proteção dos direitos e das prerrogativas do Presidente, estabelecendo critérios e limites para a instauração e o prosseguimento de processos de impeachment.",
arts:[
["Art. 1º","O processo de impeachment somente poderá prosseguir caso seja aprovado pela totalidade dos deputados responsáveis pela votação inicial."],
["Art. 2º","Após a aprovação inicial, o processo deverá obter o apoio de, no mínimo, **75% dos integrantes do grupo** para que possa prosseguir para a etapa seguinte."],
["Art. 3º","Caso qualquer uma das etapas previstas nesta Lei não alcance o percentual ou requisito mínimo estabelecido, a tentativa de impeachment será automaticamente encerrada e considerada cancelada."],
["Art. 4º","Nenhum processo de impeachment poderá prosseguir em desacordo com os requisitos estabelecidos nesta Lei."],
["Art. 5º — Da Proteção da Lei","Em razão de sua finalidade de proteção da Constituição e das garantias institucionais nela estabelecidas, esta Lei possui caráter fundamental e não poderá ser **excluída, revogada, alterada, modificada ou suspensa por qualquer cargo administrativo**, independentemente de sua hierarquia ou autoridade."]
]},
{id:"lei-2-direito-a-administracao",n:"LEI 2",title:"Do Direito à Administração",
intro:"Esta Lei estabelece as regras referentes ao exercício de funções administrativas no grupo e garante aos ocupantes de cargos superiores aos de Deputado o direito de assumir posições administrativas.",
arts:[
["Art. 1º","Todo membro que ocupar um cargo hierarquicamente superior ao cargo de Deputado terá o direito de assumir uma posição de **Administrador do Grupo**, respeitadas as demais disposições da Constituição e das Leis vigentes."],
["Art. 2º","O exercício da função de Administrador por ocupante de cargo superior aos Deputados será reconhecido como uma prerrogativa inerente ao respectivo cargo."],
["Art. 3º","A concessão da posição administrativa não poderá ser impedida pelos Deputados quando o membro preencher os requisitos estabelecidos nesta Lei."],
["Art. 4º","Os ocupantes de cargos superiores aos Deputados deverão, no exercício da função administrativa, respeitar integralmente a Constituição, as Leis e as normas internas do grupo."],
["Art. 5º","A presente Lei aplica-se igualmente a todos os ocupantes de cargos superiores aos de Deputado, sem distinção entre pessoas ou cargos, desde que estejam regularmente investidos em suas respectivas funções."],
["Art. 6º","A perda do cargo que garante o direito previsto nesta Lei implicará a perda da prerrogativa de assumir ou permanecer na posição administrativa, salvo disposição constitucional em contrário."]
]},
{id:"lei-01-proibicao-de-palavroes",n:"LEI 3",title:"Da Proibição de Palavrões e Linguagem Inadequada",
intro:"",
arts:[
["Art. 1º","Fica expressamente proibida a utilização de palavrões, xingamentos, termos chulos e palavras de baixo calão no âmbito deste grupo."],
["Art. 2º","A proibição descrita no Art. 1º aplica-se a qualquer formato de mídia ou mensagem, incluindo:",["**I** — Mensagens de texto;","**II** — Figurinhas (stickers);","**III** — Imagens, memes ou vídeos com texto incorporado;","**IV** — Áudios ou mídias de reprodução única."]],
["Art. 3º","As figurinhas que contenham palavras ofensivas, escrita explícita de palavrões ou gestos obscenos enquadram-se na mesma infração do uso de linguagem verbal inadequada."],

{"id": "lei-5-impeachment-ministros-stf", "n": "LEI 5", "title": "Do Processo de Impeachment dos Ministros do STF", "intro": "Esta Lei estabelece os requisitos, motivos e procedimentos para a apresentação e o prosseguimento de pedidos de impeachment contra Ministros do Supremo Tribunal do Grupo, garantindo que o processo seja baseado em condutas concretas e em violação das normas vigentes.", "arts": [["Art. 1º", "O Presidente poderá apresentar pedido de impeachment contra um Ministro do STF quando houver indícios ou provas de que o Ministro tenha cometido uma ou mais das condutas previstas nesta Lei."], ["Art. 2º", "Para iniciar o processo, o Presidente deverá apresentar formalmente:", ["**I** — O nome do Ministro cuja remoção do cargo está sendo solicitada;", "**II** — **3 (três) motivos distintos** que fundamentem o pedido;", "**III** — A explicação dos fatos relacionados a cada motivo;", "**IV** — As provas ou elementos que sustentem as acusações apresentadas."]], ["Art. 3º", "Cada um dos 3 (três) motivos apresentados deverá obrigatoriamente se enquadrar em uma das seguintes hipóteses:", ["**I — Favorecimento de réu:** utilizar a função de Ministro para favorecer, prejudicar ou beneficiar deliberadamente uma das partes de um julgamento;", "**II — Aplicação de pena:** determinar, executar ou aplicar diretamente uma penalidade ao réu, quando sua função for exclusivamente julgar e determinar a decisão, cabendo a execução da pena à autoridade competente;", "**III — Decisão em desacordo com a Lei:** proferir decisão ou determinar uma consequência que ultrapasse os limites estabelecidos pela Constituição, pelas Leis ou pelas normas vigentes. **O Ministro não poderá criar, aumentar ou reduzir uma pena fora dos limites estabelecidos pela legislação aplicável;**", "**IV — Ausência de oitiva do réu:** realizar julgamento sem permitir que o réu apresente sua defesa e seus argumentos, ou deixar de demonstrar, durante o julgamento, que tomou conhecimento e considerou os argumentos apresentados pela defesa, quando essa manifestação for exigida pelas regras do Tribunal;", "**V — Conflito de interesses ou parcialidade:** participar de julgamento no qual exista interesse pessoal, relação direta com uma das partes ou outra circunstância prevista nas normas do grupo que comprometa a imparcialidade necessária ao julgamento;", "**VI — Alteração indevida de decisão:** modificar uma decisão já proferida sem que exista autorização prevista na Constituição, nas Leis ou nas regras do Tribunal;","**VII — Influência externa no julgamento:** realizar ou utilizar enquetes, pesquisas, consultas públicas, votações informais ou qualquer outro meio de consulta à opinião dos integrantes do grupo com a finalidade de determinar, influenciar ou antecipar o resultado de um julgamento ou processo de impeachment. O julgamento deverá ser fundamentado nas provas, nos argumentos apresentados pelas partes e nas normas vigentes, não podendo a popularidade ou a opinião da maioria do grupo servir como fundamento para determinar a culpa ou inocência de qualquer parte."]], ["Art. 4º", "O simples fato de o Ministro proferir uma decisão desfavorável a uma das partes não constituirá, por si só, motivo para impeachment, desde que a decisão esteja fundamentada e dentro dos limites estabelecidos pelas normas vigentes."], ["Art. 5º", "Os 3 (três) motivos apresentados pelo Presidente deverão ser analisados individualmente, verificando-se se cada acusação possui fundamento e se realmente se enquadra nas hipóteses previstas no Art. 3º."], ["Art. 6º", "O Ministro acusado terá direito de apresentar sua defesa e responder individualmente a cada uma das acusações antes da votação sobre seu afastamento."], ["Art. 7º", "Durante o julgamento do impeachment, o Ministro acusado deverá ser ouvido pelo Tribunal responsável pelo processo, podendo apresentar provas, argumentos e esclarecimentos relacionados às acusações."], ["Art. 8º", "Nenhum Ministro poderá ser removido do cargo exclusivamente por discordância política, pessoal ou administrativa com o Presidente, sendo necessária a existência de pelo menos um fundamento previsto nesta Lei."], ["Art. 9º", "Caso seja comprovado que os motivos apresentados pelo Presidente são falsos, insuficientes ou não se enquadram nas hipóteses desta Lei, o pedido de impeachment será arquivado."], ["Art. 10º", "Caso as acusações sejam consideradas válidas, o processo seguirá para votação pelos membros competentes do Tribunal, conforme as regras estabelecidas pela Constituição e pelas demais Leis do grupo."], ["Art. 11º", "A decisão final deverá indicar quais acusações foram consideradas comprovadas e quais foram rejeitadas, garantindo transparência ao processo."], ["Art. 12º", "Esta Lei aplica-se igualmente a todos os Ministros do STF, sem distinção de pessoa, cargo anterior ou relação com o Presidente."], ["Art. 13º", "Esta Lei entra em vigor na data de sua publicação no grupo."]]},

const $=s=>document.querySelector(s);
const strip=s=>s.replace(/\*\*/g,"");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function full(l){return norm(l.n+" "+l.title+" "+l.intro+" "+l.arts.map(a=>a[0]+a[1]+(a[2]||[]).join(" ")).join(" "))}
LAWS.forEach(l=>l.hay=full(l));

function render(){
  const q=norm($("#q").value.trim());let c=0;
  $("#grid").innerHTML="";
  LAWS.forEach(l=>{
    if(q&&!l.hay.includes(q))return;c++;
    const d=document.createElement("div");d.className="card";d.tabIndex=0;
    d.innerHTML='<div class="n">⚜ '+esc(l.n)+'</div><h3>'+esc(l.title)+'</h3><p>'+esc((l.intro||l.arts[0][1]).replace(/\*\*/g,"").slice(0,110))+'…</p>';
    d.onclick=()=>openLaw(l,$("#q").value.trim());
    d.onkeydown=e=>{if(e.key==="Enter")d.onclick()};
    $("#grid").appendChild(d);
  });
  $("#empty").style.display=c?"none":"block";
}
$("#q").oninput=render;

function hl(html,q){
  if(!q)return html;
  const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return html.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,"<mark>$1</mark>"));
}
function openLaw(l,q){
  const s=$("#sheet");
  s.innerHTML='<button class="close" aria-label="Fechar">×</button><div class="n" style="font-family:Cinzel,serif;color:var(--red);letter-spacing:.15em;font-size:13px">⚜ '+esc(l.n)+'</div><h2>'+esc(l.title)+'</h2>'+
  (l.intro?'<p class="intro">'+esc(l.intro)+'</p>':'')+
  '<div class="tools"><input type="search" id="lq" placeholder="Pesquisar nesta lei…"></div><div class="msg" id="msg"></div><div id="body"></div>';
  $("#modal").classList.add("on");document.body.style.overflow="hidden";
  s.querySelector(".close").onclick=closeLaw;
  const inp=$("#lq");inp.value=q||"";
  const draw=()=>{
    const v=inp.value.trim(),nv=norm(v);let shown=0,html="";
    l.arts.forEach(a=>{
      const txt=norm(a[0]+" "+a[1]+" "+(a[2]||[]).join(" "));
      if(nv&&!txt.includes(nv))return;shown++;
      html+='<div class="art"><b>'+esc(a[0])+'</b> — '+hl(rich(a[1]),v)+(a[2]?'<ul>'+a[2].map(i=>'<li>'+hl(rich(i),v)+'</li>').join("")+'</ul>':'')+'</div>';
    });
    $("#body").innerHTML=html||'<p>Nenhum artigo encontrado.</p>';
    $("#msg").textContent=nv?shown+" artigo(s) encontrado(s)":"";
  };
  inp.oninput=draw;draw();
}
function closeLaw(){$("#modal").classList.remove("on");document.body.style.overflow=""}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeLaw()};
document.onkeydown=e=>{if(e.key==="Escape")closeLaw()};

render();
</script>
</body>
</html>
